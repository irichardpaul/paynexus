<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0a1425"><title>PayNexus | Security Operations</title>
<style>
:root{--bg:#f4f7fb;--navy:#0a1425;--navy2:#101f35;--ink:#16253b;--muted:#718096;--line:#e5ebf3;--blue:#2764e7;--cyan:#4fd1c5;--red:#df4b5b;--amber:#d99121;--green:#168d72;--white:#fff}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{min-height:100vh;display:flex}.sidebar{background:var(--navy);color:#c9d4e4;width:248px;padding:24px 16px;display:flex;flex-direction:column;flex-shrink:0}.brand{display:flex;align-items:center;gap:11px;padding:0 11px 28px;color:white;font-size:17px;font-weight:750;letter-spacing:.2px}.brandmark{width:34px;height:34px;background:linear-gradient(140deg,#47d2c2,#2764e7);border-radius:11px;display:grid;place-items:center;color:#07142a;font-weight:900}.brand small{display:block;font-weight:450;color:#8294ad;font-size:10px;letter-spacing:1.4px;margin-top:-2px}.navlabel{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:#7588a2;padding:11px 13px 8px}.nav{display:grid;gap:4px}.nav button{border:0;background:transparent;color:#aebbd0;text-align:left;padding:10px 13px;border-radius:8px;display:flex;gap:12px;align-items:center;font-size:13px}.nav button:hover,.nav button.active{color:#fff;background:#1a2a42}.nav button.active{box-shadow:inset 3px 0 #53d1c3}.ico{width:18px;text-align:center;color:#8ea7c5;font-size:15px}.sidebottom{margin-top:auto;border-top:1px solid #203149;padding:18px 10px 2px;font-size:12px}.sidebottom strong{color:white;display:block}.sidebottom span{color:#8294ad}.main{flex:1;min-width:0}.topbar{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 34px;position:sticky;top:0;z-index:4}.crumb{font-size:12px;color:#8996a8}.crumb b{color:var(--ink);font-size:14px;margin-left:10px}.userarea{display:flex;align-items:center;gap:13px}.rolebadge{background:#edf3ff;color:#315cba;padding:5px 10px;border-radius:20px;font-size:11px;font-weight:650}.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#2351a4;background:#e8efff;font-weight:700}.topname{font-size:12px;font-weight:650}.logout{border:1px solid var(--line);background:#fff;color:#67768b;padding:7px 11px;border-radius:7px;font-size:12px}.content{padding:30px 34px;max-width:1440px;margin:auto}.pagehead{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:23px}.pagehead h1{font-size:24px;letter-spacing:-.5px;margin:0 0 4px}.pagehead p{margin:0;color:var(--muted);font-size:13px}.eyebrow{color:#55739f;font-size:10px;letter-spacing:1.5px;font-weight:700;text-transform:uppercase;margin-bottom:7px}.grid{display:grid;gap:17px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:20px}.card{background:#fff;border:1px solid var(--line);border-radius:11px;box-shadow:0 2px 8px #172d4a08}.stat{padding:18px 19px}.stathead{display:flex;justify-content:space-between;align-items:center;color:#718096;font-size:12px}.statnum{font-size:27px;font-weight:740;margin:9px 0 1px;letter-spacing:-1px}.statfoot{font-size:11px;color:#8996a8}.staticon{height:32px;width:32px;border-radius:9px;background:#edf3ff;color:#315fb9;display:grid;place-items:center;font-size:15px}.split{grid-template-columns:1.3fr .8fr}.cardhead{padding:17px 19px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.cardhead h2{font-size:14px;margin:0;font-weight:700}.cardhead p{margin:2px 0 0;color:var(--muted);font-size:11px}.cardbody{padding:17px 19px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th{text-align:left;text-transform:uppercase;font-size:10px;letter-spacing:.9px;color:#8390a2;font-weight:650;padding:10px 12px;border-bottom:1px solid var(--line)}td{padding:12px;border-bottom:1px solid #eef2f6;font-size:12px}tr:last-child td{border-bottom:0}.pill{border-radius:20px;padding:4px 9px;font-size:10px;display:inline-flex;align-items:center;gap:5px;background:#eef2f7;color:#607188}.pill:before{content:'';width:5px;height:5px;border-radius:50%;background:currentColor}.pill.High,.pill.Critical,.pill.Flagged{background:#fff0f0;color:#cc4957}.pill.Medium,.pill.Review,.pill.Open{background:#fff6e7;color:#bf7b12}.pill.Low,.pill.Approved,.pill.Implemented,.pill.Resolved{background:#e8f7f2;color:#168467}.pill.Investigating,.pill.In.progress,.pill.Needs.review{background:#edf3ff;color:#3e69c3}.action{border:0;color:#fff;background:var(--blue);padding:9px 14px;border-radius:7px;font-size:12px;font-weight:650}.action:hover{background:#1e54c6}.secondary{background:#fff;color:#43536a;border:1px solid var(--line)}.danger{background:#fff;color:#c74757;border:1px solid #f1d7da}.small{padding:6px 9px;font-size:11px}.filterrow{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:13px}.field,.select,.area{background:#fff;border:1px solid #dfe6ef;border-radius:7px;padding:9px 11px;color:#263750;outline:none}.field:focus,.select:focus,.area:focus{border-color:#7ca0ed;box-shadow:0 0 0 3px #2764e714}.field{min-width:220px}.select{min-width:135px}.area{width:100%;min-height:92px;resize:vertical}.muted{color:var(--muted)}.timeline{display:grid;gap:13px}.logitem{display:grid;grid-template-columns:72px 1fr auto;gap:10px;align-items:center;border-bottom:1px solid #eef2f6;padding:10px 0}.logitem:last-child{border:0}.logtime{font-size:10px;color:#8492a5}.logtitle{font-weight:650;font-size:12px}.logmeta{font-size:10px;color:#8290a2}.incident{padding:15px;border:1px solid var(--line);border-radius:9px;margin-bottom:11px}.incidenttop{display:flex;justify-content:space-between;gap:8px}.incident h3{font-size:13px;margin:0 0 4px}.incident p{font-size:11px;color:var(--muted);margin:5px 0 13px}.steps{display:flex;align-items:center;gap:0;margin:14px 0}.step{flex:1;text-align:center;font-size:9px;color:#9aa5b4;position:relative}.step:before{content:'';display:block;width:14px;height:14px;border-radius:50%;background:#e6ebf2;margin:0 auto 5px;position:relative;z-index:1}.step:after{content:'';height:2px;background:#e6ebf2;position:absolute;top:6px;left:50%;width:100%}.step:last-child:after{display:none}.step.done{color:#258c79}.step.done:before,.step.done:after{background:#48bea9}.step.current{color:#315fc2;font-weight:700}.step.current:before{background:#2764e7;box-shadow:0 0 0 4px #e6edff}.step.current:after{background:#e6ebf2}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.formgrid .full{grid-column:1/-1}.label{font-size:11px;font-weight:650;color:#58677c;display:block;margin:0 0 5px}.label+.field,.label+.select{width:100%}.formrow{margin-bottom:12px}.logfilters{display:flex;gap:9px;margin-bottom:14px}.empty{padding:24px;text-align:center;color:#8390a2}.notice{background:#eef5ff;border:1px solid #dbe7fc;border-radius:9px;padding:13px 15px;color:#425e8f;font-size:12px;margin-bottom:17px}.toast{position:fixed;right:22px;bottom:22px;background:#14243a;color:#fff;padding:12px 16px;border-radius:8px;z-index:20;box-shadow:0 6px 25px #0a142544}.loginpage{min-height:100vh;display:grid;grid-template-columns:1.05fr .95fr;background:#f5f7fb}.loginhero{background:radial-gradient(ellipse at 30% 15%,#1c4065 0,transparent 46%),linear-gradient(150deg,#091426,#13243c);color:white;padding:9vh 8vw;display:flex;flex-direction:column;justify-content:space-between}.loginhero h1{font-size:42px;line-height:1.12;letter-spacing:-1.5px;margin:50px 0 16px;max-width:510px}.loginhero p{color:#aab9cc;max-width:430px;font-size:14px}.herofoot{font-size:11px;color:#8699b2}.loginform{display:flex;align-items:center;justify-content:center;padding:35px}.loginbox{width:min(390px,100%)}.loginbox h2{font-size:26px;margin:0 0 5px}.loginbox>p{color:var(--muted);margin:0 0 27px;font-size:13px}.loginbox .field{width:100%;margin-bottom:14px}.loginbox .action{width:100%;margin-top:6px;padding:11px}.demobox{margin-top:18px;padding:12px;background:#edf3ff;border-radius:8px;color:#526783;font-size:11px}.demobox strong{color:#34589d}.mobilemenu{display:none}
@media(max-width:900px){.sidebar{width:205px}.content{padding:23px}.stats{grid-template-columns:repeat(2,1fr)}.split{grid-template-columns:1fr}}
@media(max-width:650px){.shell{display:block}.sidebar{width:100%;padding:12px 15px;display:block}.brand{padding:0 5px 10px}.sidebar .navlabel,.sidebottom{display:none}.nav{display:flex;overflow:auto;gap:3px}.nav button{white-space:nowrap;padding:8px 10px;font-size:11px}.topbar{height:58px;padding:0 16px}.content{padding:19px 14px}.stats{gap:9px}.stat{padding:13px}.statnum{font-size:22px}.pagehead{gap:10px}.pagehead h1{font-size:21px}.loginpage{grid-template-columns:1fr}.loginhero{display:none}.loginform{min-height:100vh}.formgrid{grid-template-columns:1fr}.formgrid .full{grid-column:auto}.logitem{grid-template-columns:55px 1fr auto}.rolebadge{display:none}}
</style></head><body><div id="app"></div>
<script>
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let me=null, page='Overview', cache={}; const navItems=[['Overview','◫'],['Transactions','↔'],['Alerts','◉'],['Incident Response','⌁'],['Log Explorer','⌕'],['Findings','▤'],['Controls','◆'],['Instructor','▧']];
const canSOC=()=>['SOC Analyst','Security Administrator'].includes(me?.role), admin=()=>me?.role==='Security Administrator';
async function api(path,opt={}){let res=await fetch('/api'+path,{credentials:'same-origin',headers:{'Content-Type':'application/json'},...opt});let data=await res.json().catch(()=>({}));if(!res.ok)throw Error(data.error||'Request failed');return data}
function toast(s){let e=document.createElement('div');e.className='toast';e.textContent=s;document.body.append(e);setTimeout(()=>e.remove(),3000)}
function login(){ $('#app').innerHTML=`<div class="loginpage"><section class="loginhero"><div><div class="brand"><span class="brandmark">P</span><span>PayNexus<small>SECURITY OPERATIONS</small></span></div><h1>Practice the response.<br>Protect what matters.</h1><p>A fictional payment enterprise simulation for security analysis, incident response, and control evaluation.</p></div><div class="herofoot">IT 403 · Week 17 Capstone Security Case Study<br>Educational environment · Synthetic records only</div></section><section class="loginform"><form class="loginbox" id="login"><div class="eyebrow">Secure workspace</div><h2>Welcome back</h2><p>Sign in with your class account to continue.</p><label class="label">Username</label><input class="field" name="username" required autocomplete="username" placeholder="Your username"><label class="label">Password</label><input class="field" name="password" type="password" required autocomplete="current-password" placeholder="Your password"><button class="action">Sign in to PayNexus <span>→</span></button><div id="loginerr" class="muted" style="margin-top:10px;color:#cb4856"></div><div class="demobox"><strong>Instructor setup account</strong><br>Username: instructor &nbsp;·&nbsp; Password: PayNexus!2026<br><span>Change the demo password before hosting for a class.</span></div></form></section></div>`;$('#login').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target);try{await api('/login',{method:'POST',body:JSON.stringify(Object.fromEntries(f))});await boot()}catch(err){$('#loginerr').textContent=err.message}}}
function frame(){let initials=(me.display_name||me.username).split(/\s+/).map(x=>x[0]).slice(0,2).join('').toUpperCase();$('#app').innerHTML=`<div class="shell"><aside class="sidebar"><div class="brand"><span class="brandmark">P</span><span>PayNexus<small>SECURITY OPERATIONS</small></span></div><div class="navlabel">Workspace</div><nav class="nav">${navItems.filter(([n])=>n!=='Instructor'||admin()).map(([n,i])=>`<button data-page="${n}" class="${page===n?'active':''}"><span class="ico">${i}</span>${n}</button>`).join('')}</nav><div class="sidebottom"><strong>IT 403 CAPSTONE</strong><span>Educational simulation</span></div></aside><main class="main"><header class="topbar"><div class="crumb">PayNexus <b>/ ${esc(page)}</b></div><div class="userarea"><span class="rolebadge">${esc(me.role)}</span><span class="avatar">${esc(initials)}</span><span class="topname">${esc(me.display_name||me.username)}</span><button class="logout" id="changePass">Password</button><button class="logout" id="logout">Sign out</button></div></header><div class="content" id="view"></div></main></div>`;document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});$('#logout').onclick=async()=>{await api('/logout',{method:'POST'});me=null;login()};$('#changePass').onclick=async()=>{let current_password=prompt('Enter your current password:');if(current_password===null)return;let new_password=prompt('Enter a new password (at least 12 characters):');if(new_password===null)return;try{await api('/password',{method:'POST',body:JSON.stringify({current_password,new_password})});toast('Password changed')}catch(e){toast(e.message)}};render()}
function pageHead(title,sub,action=''){return `<div class="pagehead"><div><div class="eyebrow">PayNexus · ${esc(page)}</div><h1>${title}</h1><p>${sub}</p></div>${action}</div>`}
function pill(t){return `<span class="pill ${esc(t).toLowerCase().replace(/\s+/g,'-')}">${esc(t)}</span>`}
function table(headers,rows){return `<div class="tablewrap"><table><thead><tr>${headers.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows||`<tr><td colspan="${headers.length}" class="empty">Nothing to display yet.</td></tr>`}</tbody></table></div>`}
async function render(){const v=$('#view');if(!v)return;v.innerHTML='<div class="empty">Loading workspace…</div>';try{if(page==='Overview')await overview(v);else if(page==='Transactions')await transactions(v);else if(page==='Alerts')await alerts(v);else if(page==='Incident Response')await incidents(v);else if(page==='Log Explorer')await logs(v);else if(page==='Findings')await findings(v);else if(page==='Controls')await controls(v);else if(page==='Instructor')await instructor(v)}catch(e){v.innerHTML=`<div class="notice">${esc(e.message)}</div>`}}
async function overview(v){let d=await api('/overview');v.innerHTML=pageHead('Operations overview','A live view of the fictional PayNexus security environment.')+`<div class="grid stats">${[['Synthetic transactions',d.transactions,'Fictional activity'],['Open alerts',d.alerts,'Requires triage'],['Active incidents',d.incidents,'Across response stages'],['Submitted findings',d.findings,'Student analysis']].map((x,i)=>`<article class="card stat"><div class="stathead">${x[0]}<span class="staticon">${['↔','◉','⌁','▤'][i]}</span></div><div class="statnum">${x[1]}</div><div class="statfoot">${x[2]}</div></article>`).join('')}</div><div class="grid split"><section class="card"><div class="cardhead"><div><h2>Recent security events</h2><p>Newest synthetic telemetry</p></div><button class="action secondary small" onclick="go('Log Explorer')">Explore logs</button></div><div class="cardbody"><div class="timeline">${d.recent.length?d.recent.map(x=>`<div class="logitem"><span class="logtime">${esc(x.timestamp.slice(11,19))} UTC</span><div><div class="logtitle">${esc(x.event)}</div><div class="logmeta">${esc(x.source)} · ${esc(x.actor)}</div></div>${pill(x.severity)}</div>`).join(''):'<div class="empty">No events yet. Run a scenario to generate telemetry.</div>'}</div></div></section><section class="card"><div class="cardhead"><div><h2>Scenario lab</h2><p>Controlled synthetic attack sequence</p></div></div><div class="cardbody"><div class="eyebrow">Active scenario</div><h3 style="margin:3px 0 7px;font-size:16px">Suspicious Transaction API Activity</h3><p class="muted" style="font-size:12px">Simulate authentication failures, transaction API enumeration, suspected authorization bypass, and unusual database reads.</p><div class="notice">Simulation run ${d.scenario_runs} · Generated events are labeled as synthetic. No systems are attacked.</div>${canSOC()?'<button class="action" id="runScenario">Run scenario sequence →</button>':`<span class="muted">${admin()?'':'SOC role required to launch a scenario.'}</span>`}${admin()?'<button class="action danger small" id="resetScenario" style="margin-left:8px">Reset scenario data</button>':''}</div></section></div><div class="notice" style="margin-top:17px">Educational environment only. All customer, transaction, identity, and event records are fictional; this app does not connect to banks or live SIEM telemetry.</div>`;if($('#runScenario'))$('#runScenario').onclick=async()=>{try{await api('/scenario/run',{method:'POST',body:'{}'});toast('Scenario events created');render()}catch(e){toast(e.message)}};if($('#resetScenario'))$('#resetScenario').onclick=async()=>{if(confirm('Reset generated scenario alerts, incidents, and logs?')){await api('/scenario/reset',{method:'POST',body:'{}'});toast('Scenario data reset');render()}}}
function go(p){page=p;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}
async function transactions(v){let rows=await api('/transactions');v.innerHTML=pageHead('Transaction management','Fictional wallet activity for investigation.')+`<section class="card">${table(['Transaction ID','Merchant','Amount','Status','Recorded'],rows.map(x=>`<tr><td><b>${esc(x.id)}</b></td><td>${esc(x.merchant)}</td><td>₱${Number(x.amount).toLocaleString('en-PH',{minimumFractionDigits:2})}</td><td>${pill(x.status)}</td><td>${esc(x.created_at.slice(0,10))}</td></tr>`).join(''))}</section>`}
async function alerts(v){let rows=await api('/alerts');v.innerHTML=pageHead('Security alerts','Triage simulated detections and capture investigation work.')+`<section class="card">${table(['Alert','Severity','Source','Status','Created','Action'],rows.map(x=>`<tr><td><b>${esc(x.title)}</b><div class="logmeta">${esc(x.detail)}</div></td><td>${pill(x.severity)}</td><td>${esc(x.source)}</td><td>${pill(x.status)}</td><td>${esc(x.created_at.slice(0,10))}</td><td>${canSOC()?`<select class="select" onchange="alertStatus(${x.id},this.value)"><option ${x.status==='Open'?'selected':''}>Open</option><option ${x.status==='Investigating'?'selected':''}>Investigating</option><option ${x.status==='Resolved'?'selected':''}>Resolved</option></select>`:'—'}</td></tr>`).join(''))}</section>`}
async function alertStatus(id,status){try{await api(`/alerts/${id}/status`,{method:'POST',body:JSON.stringify({status})});toast('Alert updated')}catch(e){toast(e.message);render()}}
async function incidents(v){let rows=await api('/incidents'), stages=['Detection','Analysis','Containment','Eradication','Recovery','Closed'];v.innerHTML=pageHead('Incident response','Move investigations through the incident lifecycle.')+rows.map(x=>`<article class="card incident"><div class="incidenttop"><div><h3>${esc(x.title)}</h3><div class="logmeta">Owner: ${esc(x.owner)} · Updated ${esc(x.updated_at.replace('T',' ').slice(0,16))}</div></div>${pill(x.severity)}</div><p>${esc(x.summary)}</p><div class="steps">${stages.map((s,i)=>`<div class="step ${i<stages.indexOf(x.stage)?'done':i===stages.indexOf(x.stage)?'current':''}">${s}</div>`).join('')}</div><div style="display:flex;justify-content:space-between;align-items:center"><span>${pill(x.stage)}</span>${canSOC()?`<label class="muted" style="font-size:11px">Update stage <select class="select" onchange="incidentStage(${x.id},this.value)">${stages.map(s=>`<option ${x.stage===s?'selected':''}>${s}</option>`).join('')}</select></label>`:''}</div></article>`).join('')||'<div class="card empty">No incidents recorded.</div>'}
async function incidentStage(id,stage){try{await api(`/incidents/${id}/stage`,{method:'POST',body:JSON.stringify({stage})});toast('Incident workflow updated');render()}catch(e){toast(e.message)}}
async function logs(v){v.innerHTML=pageHead('SIEM log explorer','Search synthetic authentication, API, application, and database events.')+`<section class="card"><div class="cardbody"><div class="logfilters"><input class="field" id="logq" placeholder="Search event, actor, IP, or details"><select class="select" id="logsrc"><option value="">All sources</option>${['Authentication','API','Application','Database'].map(x=>`<option>${x}</option>`).join('')}</select><select class="select" id="logsev"><option value="">All severity</option>${['Critical','High','Medium','Low','Info'].map(x=>`<option>${x}</option>`).join('')}</select><button class="action" id="searchLogs">Search</button></div><div id="logtable"></div></div></section>`;const search=async()=>{let p=new URLSearchParams({q:$('#logq').value,source:$('#logsrc').value,severity:$('#logsev').value});let rows=await api('/logs?'+p);$('#logtable').innerHTML=table(['Time','Source','Event','Severity','Actor','Source IP','Details'],rows.map(x=>`<tr><td>${esc(x.timestamp.replace('T',' ').slice(0,19))}</td><td>${esc(x.source)}</td><td><b>${esc(x.event)}</b><div class="logmeta">${esc(x.scenario_id==='baseline'?'Baseline':'Synthetic '+x.scenario_id)}</div></td><td>${pill(x.severity)}</td><td>${esc(x.actor)}</td><td>${esc(x.ip)}</td><td>${esc(x.detail)}</td></tr>`).join(''))};$('#searchLogs').onclick=search;$('#logq').onkeydown=e=>{if(e.key==='Enter')search()};await search()}
async function findings(v){let rows=await api('/findings');v.innerHTML=pageHead('Investigation findings','Document evidence, assess risk, and submit recommendations.')+`${['Student Analyst','SOC Analyst'].includes(me.role)?`<section class="card" style="margin-bottom:16px"><div class="cardhead"><div><h2>Submit an investigation finding</h2><p>Use evidence from simulated alerts and logs.</p></div></div><div class="cardbody"><form id="findingForm" class="formgrid"><div><label class="label">Finding title</label><input name="title" class="field" required placeholder="e.g. API authorization gap"></div><div><label class="label">Category</label><select name="category" class="select" style="width:100%"><option>Threat analysis</option><option>Architecture weakness</option><option>Control gap</option><option>Incident evidence</option><option>Recovery recommendation</option></select></div><div class="full"><label class="label">Evidence and analysis</label><textarea name="evidence" class="area" required placeholder="Describe the event, source, affected asset, and your reasoning."></textarea></div><div class="full"><label class="label">Recommended action</label><textarea name="recommendation" class="area" placeholder="What control or response step should be applied?"></textarea></div><div class="full"><button class="action">Submit finding</button></div></form></div></section>`:''}<section class="card">${table(['Finding','Submitter','Category','Status','Score','Feedback'],rows.map(x=>`<tr><td><b>${esc(x.title)}</b><div class="logmeta">${esc(x.evidence)}</div><div class="logmeta" style="margin-top:5px">Recommendation: ${esc(x.recommendation||'—')}</div></td><td>${esc(x.submitter)}</td><td>${esc(x.category)}</td><td>${pill(x.status)}</td><td>${x.score===null?'—':`${x.score}/25`}</td><td>${esc(x.feedback||'—')}${admin()?`<button class="action secondary small" style="display:block;margin-top:5px" onclick="reviewFinding(${x.id},${JSON.stringify(x.title)})">Evaluate</button>`:''}</td></tr>`).join(''))}</section>`;if($('#findingForm'))$('#findingForm').onsubmit=async e=>{e.preventDefault();try{await api('/findings',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});toast('Finding submitted');render()}catch(err){toast(err.message)}}}
async function reviewFinding(id,title){let score=prompt(`Score ${title} from 0 to 25:`);if(score===null)return;let feedback=prompt('Instructor feedback:')||'';try{await api(`/findings/${id}/review`,{method:'POST',body:JSON.stringify({score:Number(score),feedback})});toast('Evaluation saved');render()}catch(e){toast(e.message)}}
async function controls(v){let rows=await api('/controls');v.innerHTML=pageHead('Control register','Track baseline control implementation and ownership.')+`<section class="card">${table(['Control','Description','Framework','Owner','Status','Update'],rows.map(x=>`<tr><td><b>${esc(x.id)}</b></td><td>${esc(x.name)}</td><td>${esc(x.framework)}</td><td>${esc(x.owner)}</td><td>${pill(x.status)}</td><td>${admin()?`<select class="select" onchange="controlStatus(${JSON.stringify(x.id)},this.value)">${['Implemented','In progress','Needs review'].map(s=>`<option ${s===x.status?'selected':''}>${s}</option>`).join('')}</select>`:'—'}</td></tr>`).join(''))}</section>`}
async function controlStatus(id,status){try{await api(`/controls/${encodeURIComponent(id)}/status`,{method:'POST',body:JSON.stringify({status})});toast('Control updated');render()}catch(e){toast(e.message)}}
async function instructor(v){let [users,activity,findings]=await Promise.all([api('/users'),api('/activity'),api('/findings')]);v.innerHTML=pageHead('Instructor console','Manage class accounts, review findings, and monitor activity.')+`<div class="grid split"><section class="card"><div class="cardhead"><div><h2>Create student or staff account</h2><p>Each person gets an individual sign-in.</p></div></div><div class="cardbody"><form id="userForm" class="formgrid"><div><label class="label">Username</label><input class="field" name="username" required minlength="3"></div><div><label class="label">Display name</label><input class="field" name="display_name" required></div><div><label class="label">Temporary password</label><input class="field" name="password" required minlength="12"></div><div><label class="label">Role</label><select class="select" name="role" style="width:100%">${['Student Analyst','SOC Analyst','Executive','Security Administrator'].map(x=>`<option>${x}</option>`).join('')}</select></div><div class="full"><button class="action">Create account</button></div></form></div></section><section class="card"><div class="cardhead"><div><h2>Class activity</h2><p>Recent account and workflow events</p></div></div><div class="cardbody">${activity.slice(0,8).map(x=>`<div class="logitem"><span class="logtime">${esc(x.created_at.slice(11,16))}</span><div><div class="logtitle">${esc(x.action)}</div><div class="logmeta">${esc(x.display_name||'Unknown')} · ${esc(x.detail)}</div></div></div>`).join('')||'<div class="empty">No activity yet.</div>'}</div></section></div><section class="card" style="margin-top:17px"><div class="cardhead"><div><h2>Class accounts</h2><p>Disable access for accounts that should no longer sign in.</p></div></div>${table(['User','Username','Role','Status','Action'],users.map(x=>`<tr><td>${esc(x.display_name)}</td><td>${esc(x.username)}</td><td>${esc(x.role)}</td><td>${pill(x.active?'Active':'Disabled')}</td><td>${x.id===me.id?'Current account':`<button class="action ${x.active?'danger':'secondary'} small" onclick="toggleUser(${x.id},${!x.active})">${x.active?'Disable':'Enable'}</button>`}</td></tr>`).join(''))}</section><section class="card" style="margin-top:17px"><div class="cardhead"><div><h2>Submitted findings · ${findings.length}</h2><p>Evaluate student analysis in the Findings workspace.</p></div><button class="action secondary small" onclick="go('Findings')">Open findings</button></div></section>`;$('#userForm').onsubmit=async e=>{e.preventDefault();try{await api('/users',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});toast('Account created');render()}catch(err){toast(err.message)}}}
async function toggleUser(id,active){if(!confirm(`${active?'Enable':'Disable'} this account?`))return;try{await api(`/users/${id}/active`,{method:'POST',body:JSON.stringify({active})});toast('Account access updated');render()}catch(e){toast(e.message)}}
async function boot(){let d=await api('/me');me=d.user;if(!me){login();return}if(page==='Instructor'&&!admin())page='Overview';frame()}boot().catch(login);
</script></body></html>
